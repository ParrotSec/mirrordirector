# Mirror director configuration
#
# Rebuilt from the official Parrot documentation mirror list
# (https://www.parrotsec.org/docs/mirrors/mirrors-list/), which is
# fresher than the remote config served by the master server.
#
# Every mirror listed here was probed for a valid repository index
# (<url>/misc/vindex.db) before inclusion, so ISO-only mirrors and
# dead/broken entries from the documentation were dropped.
#
# Country and continent keys follow the codes the redirector
# actually sees from GeoLite2: ISO 3166-1 alpha-2 country codes and
# MaxMind continent codes (EU, NA, SA, AS, OC, AF). Notable mappings:
#   documentation      redirector
#   US states       -> US / NA
#   England         -> GB / EU
#   Ecuador, Brazil -> EC / SA, BR / SA   (docs merge them into "NCSA")
#   Russia          -> RU / EU            (MaxMind classifies RU as EU)
#   Turkey, Iran, Azerbaijan -> TR / AS, IR / AS, AZ / AS
#                                       (docs merge them into "EMEA")

continents:
  MASTER:
    MASTER:
      mirrors:
        - name: "Master"
          url: "https://deb.parrot.sh/direct/parrot"
          version: 9999
          down: false

  DEFAULT:
    DEFAULT:
      mirrors:
        - name: 'geo.bunny'
          url: 'https://bunny.deb.parrot.sh/parrot'
        - name: "geo.parrot"
          url: "https://deb.parrot.sh/direct/parrot"
        - name: 'geo.rfc2549.global'
          url: 'https://mirror.rfc2549.network/direct/parrot'
        - name: 'geo.aliyun'
          url: 'https://mirrors.aliyun.com/parrot/'

